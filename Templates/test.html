<div class="col-xxl-5 col-xl-5 col-lg-8 col-md-7 col-6">
   <div class="it-header-right-action d-flex justify-content-end align-items-center">
      
      <!-- SEARCH FORM -->
      <form action="{% url 'courses' %}" method="get" class="d-flex align-items-center gap-2">
         
         <!-- Category Dropdown -->
         <div class="it-header-categorie p-relative d-flex align-items-center">
            <span>
               <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <!-- your SVG icon -->
               </svg>
            </span> 
            <div class="contact__select">
               <select name="category" onchange="this.form.submit()">
                  <option value="">All Departments</option>
                  {% for cat in categories %}
                     <option value="{{ cat.name }}" 
                        {% if request.GET.category == cat.name %}selected{% endif %}>
                        {{ cat.name }}
                     </option>
                  {% endfor %}
               </select>
            </div>
         </div>
         
         <!-- Search Input -->
         <div class="it-header-search">
            <input type="text" name="q" placeholder="Search Course.." 
               value="{{ request.GET.q|default:'' }}">
            <button type="submit" class="icon" style="border:none; background:transparent;">
               <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <!-- your SVG search icon -->
               </svg>
            </button>
         </div>
         
      </form>
      <!-- END SEARCH FORM -->
      
      <!-- The rest of your header elements (cart, apply now, etc.) -->
      <a class="it-header-cart d-none d-xxl-block" href="cart.html">...</a>
      <a href="courses-with-filter.html" class="it-btn-yellow d-none d-md-flex">...</a>
      <div class="it-header-bar d-xl-none">...</div>
      
   </div>
</div>
